name: Build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Nightly, so dependency advisories and toolchain drift surface without a push.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BusTicketSaleSystem.slnx

      # SQL Server LocalDB is preinstalled on windows-latest. Without it the
      # integration tests skip; with it they run, which is the point of AUD-H-001.
      - name: Start SQL Server LocalDB
        run: |
          sqllocaldb create MSSQLLocalDB -s || sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
        shell: cmd
        continue-on-error: true

      - name: Verify formatting
        run: |
          dotnet format BusTicketSaleSystem/BusTicketSaleSystem.csproj --verify-no-changes --no-restore
          dotnet format BusTicketSaleSystem.Tests/BusTicketSaleSystem.Tests.csproj --verify-no-changes --no-restore

      # Analyzers are enabled in Directory.Build.props; -warnaserror makes a new
      # warning a build failure so the clean baseline cannot silently rot.
      - name: Build
        run: dotnet build BusTicketSaleSystem.slnx --no-restore --configuration Release --nologo -warnaserror

      - name: Test
        run: dotnet test BusTicketSaleSystem.Tests/BusTicketSaleSystem.Tests.csproj --no-build --configuration Release --nologo --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        run: dotnet list BusTicketSaleSystem.slnx package --vulnerable --include-transitive 2>&1 | tee audit.log; if grep -q 'has the following vulnerable packages' audit.log; then echo 'Vulnerable packages found.'; exit 1; fi
        shell: bash

      - name: Publish a versioned build
        run: dotnet publish BusTicketSaleSystem/BusTicketSaleSystem.csproj --configuration Release --runtime win-x64 --self-contained false --output publish --nologo

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results.trx
            **/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload application build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BusTicketSaleSystem-win-x64
          path: publish
